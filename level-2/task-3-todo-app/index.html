<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do App</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>My To-Do List</h1>

    <form id="task-form" class="task-form">
      <input type="text" id="task-input" placeholder="What do you need to do?" autocomplete="off">
      <button type="submit" class="add-btn">Add Task</button>
    </form>

    <div class="lists">
      <section class="panel">
        <div class="panel-header">
          <h2>Pending Tasks</h2>
          <span id="pending-count" class="count">0 pending</span>
        </div>
        <ul id="pending-list" class="task-list"></ul>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Completed Tasks</h2>
          <span id="completed-count" class="count">0 completed</span>
        </div>
        <ul id="completed-list" class="task-list"></ul>
      </section>
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
